name: CI Pipeline

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client (Write Service)
        working-directory: services/write-service
        run: npx prisma generate

      - name: Generate Prisma Client (Read Service)
        working-directory: services/read-service
        run: npx prisma generate

      - name: Build All Services
        run: npm run build

      - name: Run Test Suite
        run: npm test
