services:
  # ==============================================================================
  # Storages & Data Layer
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_write
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_write"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "wal_level=logical"]

  mongodb:
    image: mongo:7-jammy
    container_name: ecommerce_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: ecommerce_read
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # ==============================================================================
  # Messaging & Event-Driven Backbone (Apache Kafka KRaft)
  # ==============================================================================
  kafka:
    image: apache/kafka:latest
    container_name: ecommerce_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  # ==============================================================================
  # Change Data Capture (Debezium Connect & Auto-Registration)
  # ==============================================================================
  debezium:
    image: quay.io/debezium/connect:latest
    container_name: ecommerce_debezium
    restart: always
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      - kafka
      - postgres

  debezium-init:
    image: curlimages/curl:latest
    container_name: ecommerce_debezium_init
    restart: "no"
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/bin/sh", "/scripts/register-connector.sh"]
    depends_on:
      - debezium

  # ==============================================================================
  # Distributed Tracing & Observability (Jaeger All-In-One)
  # ==============================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ecommerce_jaeger
    restart: always
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # ==============================================================================
  # Microservices & Workers
  # ==============================================================================
  write-service:
    build:
      context: .
      dockerfile: services/write-service/Dockerfile
    container_name: ecommerce_write_service
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ecommerce_write?schema=public
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  sync-worker:
    build:
      context: .
      dockerfile: services/sync-worker/Dockerfile
    container_name: ecommerce_sync_worker
    restart: always
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=ecommerce_cdc.public.outbox
      - KAFKA_DLQ_TOPIC=ecommerce.cdc.outbox.dlq
      - MONGODB_URI=mongodb://root:root@mongodb:27017/ecommerce_read?authSource=admin
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      - kafka
      - mongodb
      - debezium
      - jaeger

  read-service:
    build:
      context: .
      dockerfile: services/read-service/Dockerfile
    container_name: ecommerce_read_service
    restart: always
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGODB_URI=mongodb://root:root@mongodb:27017/ecommerce_read?authSource=admin
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      - mongodb
      - jaeger

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: ecommerce_api_gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - WRITE_SERVICE_URL=http://write-service:3001
      - READ_SERVICE_URL=http://read-service:3002
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      - write-service
      - read-service
      - jaeger

volumes:
  postgres_data:
  mongodb_data:
