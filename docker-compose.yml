version: '3.8'

services:
  postgres:     
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    restart: always
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_write
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -u postgres -d ecommerce_write"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "wal_level=logical"]

  write-service:
    build:
      context: .
      dockerfile: services/write-service/Dockerfile
    container_name: ecommerce_write_service
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ecommerce_write?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  read-service:
    build:
      context: .
      dockerfile: services/read-service/Dockerfile
    container_name: ecommerce_read_service
    restart: always
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ecommerce_write?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: ecommerce_api_gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - WRITE_SERVICE_URL=http://write-service:3001
      - READ_SERVICE_URL=http://read-service:3002
    depends_on:
      - write-service
      - read-service

volumes:
  postgres_data:
